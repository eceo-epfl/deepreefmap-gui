# Class group taxonomy for benthic cover roll-up (fine -> intermediate -> coarse).
# Keyed by segmentation class id. `fine` is the class name itself (from the
# classes YAML); only intermediate/coarse groupings live here.

# Bump `version` whenever any grouping below changes. Cover exports record this
# number and a hash of the file, so a recomputed figure can be told apart from
# one grouped by an earlier taxonomy.
